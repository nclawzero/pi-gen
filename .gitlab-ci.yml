# pi-gen-nclawzero — CI policy: lint only.
# Full image build is too heavy for shared GitLab runners; gated to a
# self-hosted runner (TBD on ARGOS).

stages:
  - lint

shellcheck:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - docker run --rm -v $CI_PROJECT_DIR:/src -w /src koalaman/shellcheck-alpine:stable sh -c "apk add --no-cache bash && find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning --exclude=SC2010 && find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n"
